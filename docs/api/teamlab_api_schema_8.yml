        участие появляется только после accepted RoleInterest.
      operationId: listProjectMemberships
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          description: Фильтрация по проекту через project_role.
          schema:
            type: integer
        - name: project_role_id
          in: query
          required: false
          description: Фильтрация по роли проекта.
          schema:
            type: integer
        - name: user_id
          in: query
          required: false
          description: Фильтрация по пользователю.
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Фильтрация по статусу участия.
