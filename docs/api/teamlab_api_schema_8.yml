components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Номер страницы.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Количество объектов на странице.
      schema:
        type: integer
        minimum: 1
        default: 10
    UserIdParam:
      name: user_id
      in: path
      required: true
      description: Уникальный идентификатор пользователя.
      schema:
        type: integer
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      description: Уникальный идентификатор проекта.
      schema:
        type: integer
    RoleIdParam:
      name: role_id
      in: path
      required: true
      description: Уникальный идентификатор роли проекта.
      schema:
        type: integer
    InterestIdParam:
      name: interest_id
      in: path
      required: true
      description: Уникальный идентификатор RoleInterest.
      schema:
        type: integer
    MembershipIdParam:
      name: membership_id
      in: path
      required: true
      description: Уникальный идентификатор ProjectMembership.
      schema:
        type: integer
    PortfolioWorkIdParam:
      name: portfolio_work_id
      in: path
      required: true
      description: Уникальный идентификатор работы портфолио.
      schema:
        type: integer

  responses:
    ValidationErrorResponse:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            field:
              - Обязательное поле.
              - Значение не соответствует ожидаемому формату.
            non_field_errors:
              - Некорректное состояние объекта.
              - Действие недоступно для текущего ресурса.
    UnauthorizedResponse:
      description: Учетные данные не были предоставлены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            detail: Учетные данные не были предоставлены.
    ForbiddenResponse:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
          example:
            detail: Недостаточно прав.
    NotFoundResponse:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          example:
            detail: Объект не найден.
    ConflictResponse:
      description: Конфликт бизнес-правил
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
          example:
            detail: Объект с такой связкой уже существует.

  schemas:
    AccountType:
      type: string
      description: Режим пользователя в продукте.
      enum:
        - participant
        - owner

    UserLevel:
      type: string
      description: Уровень пользователя.
      enum:
        - junior
        - middle
        - senior

    WorkFormat:
      type: string
      description: Предпочитаемый формат работы.
      enum:
        - remote
        - hybrid

    UserSkillLevel:
      type: string
      description: Уровень владения навыком.
      enum:
        - basic
        - middle
        - advanced

    ProjectStatus:
      type: string
      description: Статус проекта.
      enum:
        - open
        - closed

    ProjectRelation:
      type: string
      description: Тип связи пользователя с проектом.
      enum:
        - owner
        - member

    RoleInterestStatus:
      type: string
      description: Статус отклика на роль.
      enum:
        - pending
        - accepted
        - rejected

    RoleInterestSource:
      type: string
      description: |
        Источник RoleInterest: `application` создаёт participant, `invitation` создаёт owner проекта.
      enum:
        - application
        - invitation

    ProjectMembershipStatus:
      type: string
      description: Статус участия в проекте.
      enum:
        - active
        - left
        - removed

    ProjectMembershipUpdateStatus:
      type: string
      description: Статус, доступный для завершения участия через API.
      enum:
        - left
        - removed

    ValidationError:
      type: object
      description: |
        Ошибка валидации. Ключи объекта соответствуют именам полей,
        значения — массивы строк с сообщениями ошибок.
      additionalProperties:
        type: array
        items:
          type: string

    DetailMessage:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    UnauthorizedError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    ForbiddenError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    NotFoundError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Skill:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    SkillCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    Field:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    FieldCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    Specialization:
      type: object
      required:
        - id
        - field_id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        field_id:
          type: integer
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    SpecializationCreateRequest:
      type: object
      required:
        - field_id
        - name
      properties:
        field_id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 255

    UserSkill:
      type: object
      required:
        - id
        - user_id
        - skill_id
        - level
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        skill_id:
          type: integer
        level:
          $ref: '#/components/schemas/UserSkillLevel'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    UserSkillInput:
      type: object
      required:
        - skill_id
        - level
      properties:
        skill_id:
          type: integer
        level:
          $ref: '#/components/schemas/UserSkillLevel'

    PortfolioWork:
      type: object
      required:
        - id
        - user_id
        - title
        - task
        - solution
        - image
        - technologies
        - link
        - created_at
        - updated_at
      properties:
        id:
