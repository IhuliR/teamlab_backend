openapi: 3.0.3
info:
  title: TeamLab API
  version: 1.1.0
  description: |
    API MVP-платформы TeamLab.

    Канонический поток домена:
    Project -> ProjectRole -> RoleInterest -> ProjectMembership.

    ProjectRole описывает роль, специализацию или направление внутри проекта.
    На одну роль может быть несколько участников. Заявки и приглашения представлены
    RoleInterest с source = application или source = invitation. ProjectMembership
    создаётся только при accept RoleInterest. Notifications в MVP являются read-only
    представлением pending RoleInterest и не имеют отдельной модели.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Auth
    description: JWT-аутентификация
  - name: Users
    description: Пользователи и публичные профили
  - name: Me
    description: Ресурсы текущего пользователя
  - name: Skills
    description: Справочник навыков
  - name: Specializations
    description: Справочник специализаций
  - name: Fields
    description: Справочник областей
  - name: Projects
    description: Проекты, заявки и приглашения внутри проекта
  - name: Project Roles
    description: Роли и направления проекта
  - name: Role Interests
    description: Action endpoints для заявок и приглашений
  - name: Memberships
    description: Action endpoints для завершения участия

paths:
  /api/v1/auth/token/login/:
    post:
      tags: [Auth]
      summary: Получить JWT-токены
      description: Авторизация по username и паролю. Email сохраняется как контактное/будущее поле, но не является login identifier в MVP.
      operationId: tokenLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenLoginRequest'
            example:
              username: ivan_backend
              password: current-password-2026
      responses:
        '200':
          description: Токены выданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/auth/token/refresh/:
    post:
      tags: [Auth]
      summary: Обновить access- и refresh-токены
      operationId: tokenRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Access- и refresh-токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/:
    get:
      tags: [Users]
      summary: Список пользователей
      description: |
        Публичный список безопасных карточек пользователей. Email, notification settings
        и приватные контакты не возвращаются. Поиск в хедере раздела участников
        использует `GET /api/v1/users/?search=...`; отдельный глобальный `/search/`
        endpoint в MVP не добавляется.

        `specialization_ids` и `skill_ids` принимают comma-separated lists и работают
        как OR внутри своей группы. Разные группы фильтров применяются совместно.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Поиск по username, display_name, bio, city, названию специализации и навыкам.
          schema:
            type: string
        - name: field_id
          in: query
          description: "Фильтр через `user.specialization.field_id`."
          schema:
            type: integer
        - name: specialization_ids
          in: query
          description: Comma-separated list ID специализаций пользователя. OR внутри группы.
          schema:
            type: string
        - name: skill_ids
          in: query
          description: Comma-separated list ID навыков пользователя. OR внутри группы.
          schema:
            type: string
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/UserLevel'
        - name: city
          in: query
          schema:
            type: string
        - name: work_format
          in: query
          schema:
            $ref: '#/components/schemas/WorkFormat'
        - name: employment_type
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentType'
        - name: search_status
          in: query
          schema:
            $ref: '#/components/schemas/SearchStatus'
        - name: ordering
          in: query
          description: |
            Сортировка минимум по `created_at`, `updated_at`, `username`.
            Пример: `ordering=-created_at`.
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: 2
                    username: ivan_backend
                    display_name: Иван Backend
                    avatar: https://cdn.teamlab.example/avatars/ivan_backend.png
                    specialization_id: 1
                    specialization_name: Backend-разработчик
                    level: middle
                    city: Санкт-Петербург
                    workload_hours_per_week: 20
                    work_format: remote
                    employment_type: part_time
                    skills:
                      - id: 1
                        user_id: 2
                        skill_id: 1
                        name: Python
                        level: advanced
                        created_at: '2026-03-12T09:20:00Z'
                        updated_at: '2026-04-01T10:00:00Z'
                    search_status: looking_for_team
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
    post:
      tags: [Users]
      summary: Регистрация пользователя
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: maria_ux
              display_name: Мария UX
              email: maria.ux@example.com
              password: strong-password-2026
              account_type: participant
              specialization_id: 2
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/users/{user_id}/:
    get:
      tags: [Users]
      summary: Публичный профиль пользователя
      description: Возвращает публичную информацию. account_type не отдаётся в публичном профиле.
      operationId: retrieveUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Публичный профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/:
    get:
      tags: [Me]
      summary: Текущий пользователь
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Me]
      summary: Изменить профиль текущего пользователя
      description: |
        Participant не может убрать или изменить `specialization_id`, если у него есть
        active ProjectMembership, pending RoleInterest(source=application) или pending
        RoleInterest(source=invitation). Historical states (`rejected`, `accepted`,
        `left`, `removed`) сами по себе не блокируют смену specialization.
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/avatar/:
    put:
      tags: [Me]
      summary: Загрузить или заменить аватар
      operationId: uploadCurrentUserAvatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUpdateRequest'
      responses:
        '200':
          description: Аватар сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Me]
      summary: Удалить аватар
      operationId: deleteCurrentUserAvatar
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Аватар удалён
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/set_password/:
    post:
      tags: [Me]
      summary: Изменить пароль текущего пользователя
      operationId: setCurrentUserPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/skills/:
    get:
      tags: [Skills]
      summary: Список навыков
      description: Публичный справочник навыков.
      operationId: listSkills
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: ordering
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список навыков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
    post:
      tags: [Skills]
      summary: Создать навык
      description: Skill — расширяемый пользовательский справочник; создание доступно авторизованному пользователю.
      operationId: createSkill
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
      responses:
        '201':
          description: Навык создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

  /api/v1/specializations/:
    get:
      tags: [Specializations]
      summary: Список специализаций
      description: |
        Публичный системный справочник специализаций. Specialization управляется
        через админку, seed или служебные инструменты; пользователь не создаёт
        specializations через публичный API.
      operationId: listSpecializations
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: field_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Список специализаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialization'

  /api/v1/fields/:
    get:
      tags: [Fields]
      summary: Список областей
      description: |
        Публичный системный справочник областей. Field управляется через админку,
        seed или служебные инструменты; пользователь не создаёт fields через публичный API.
        Синтетическая карточка "Все профили" не является записью Field в базе.
      operationId: listFields
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список областей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /api/v1/fields/featured/:
    get:
      tags: [Fields]
      summary: Области для главной
      description: |
        Публичный endpoint для блока на главной. Возвращает Field с
        `is_featured = true`, порядок: `featured_order`, затем `name`.
        `is_featured` и `featured_order` управляются администратором через
        админку/служебные инструменты. `featured_order` не отдаётся в публичном response.
      operationId: listFeaturedFields
      responses:
        '200':
          description: Featured области
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /api/v1/projects/:
    get:
      tags: [Projects]
      summary: Список проектов
      description: |
        Публичный список проектов с `roles_preview`. Поиск в хедере раздела проектов
        использует `GET /api/v1/projects/?search=...`.

        `specialization_ids` и `skill_ids` принимают comma-separated lists и работают
        как OR внутри своей группы. Разные группы фильтров применяются совместно.
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Поиск по названию, описанию, проблеме, области, специализациям ролей и навыкам ролей проекта.
          schema:
            type: string
        - name: status
          in: query
          description: Фильтр по статусу проекта.
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: field_id
          in: query
          description: Фильтр по области проекта.
          schema:
            type: integer
        - name: specialization_ids
          in: query
          description: Comma-separated list ID специализаций ролей проекта. OR внутри группы.
          schema:
            type: string
        - name: skill_ids
          in: query
          description: Comma-separated list ID навыков, требуемых в ролях проекта. OR внутри группы.
          schema:
            type: string
        - name: ordering
          in: query
          description: |
            Сортировка минимум по `created_at`, `updated_at`, `title`.
            Пример: `ordering=-created_at`.
          schema:
            type: string
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
    post:
      tags: [Projects]
      summary: Создать проект с ролями
      description: |
        Создаёт проект и вложенные роли. `roles` обязателен и должен содержать
        минимум одну роль. В одном проекте не может быть две ProjectRole с одной
        specialization. `is_featured` и `featured_order` не принимаются публичным API
        и управляются администратором через админку/служебные инструменты.
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            example:
              field_id: 1
              title: Планировщик учебных встреч
              description: Веб-платформа для планирования учебных групп и воркшопов.
              problem: Студенческим сообществам сложно быстро находить участников.
              image: null
              roles:
                - specialization_id: 1
                  tasks:
                    - Разработать REST API проекта.
                  benefits:
                    - Практика backend-разработки.
                  skills:
                    - skill_id: 1
                      description: Python backend.
                      order: 1
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/projects/featured/:
    get:
      tags: [Projects]
      summary: Проекты недели
      description: |
        Публичный endpoint для блока "Проекты недели" на главной. Использует ту же
        response schema, что `GET /api/v1/projects/`. Возвращает проекты с
        `is_featured = true`, порядок: `featured_order`, затем `-created_at`.
        `is_featured` и `featured_order` управляются администратором; `featured_order`
        не отдаётся в публичном response и не принимается публичным create/update API.
      operationId: listFeaturedProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Featured проекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'

  /api/v1/projects/{project_id}/:
    get:
      tags: [Projects]
      summary: Детали проекта
      description: |
        Детальная карточка проекта содержит roles и контекст текущего пользователя;
        roles_preview здесь не возвращается. Для anonymous пользователя context fields
        возвращаются как `null`: `matching_role_id`, `matching_role_name`,
        `my_interest_id`, `my_interest_status`, `my_interest_source`,
        `my_membership_id`, `my_membership_status`.
      operationId: retrieveProject
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Детали проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    patch:
      tags: [Projects]
      summary: Изменить проект
      description: |
        Обновляет публично редактируемые поля проекта. `is_featured` и
        `featured_order` не принимаются публичным API и управляются администратором
        через админку/служебные инструменты.
      operationId: updateProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Проект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/projects/{project_id}/applications/:
    get:
      tags: [Projects]
      summary: Входящие заявки проекта
      description: Owner получает RoleInterest(source=application) по конкретному проекту с вложенной карточкой пользователя.
      operationId: listProjectApplications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Список заявок проекта
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectApplicationCard'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Projects]
      summary: Откликнуться на проект
      description: |
        Participant создаёт заявку. Backend определяет подходящую ProjectRole по
        специализации текущего пользователя. Если RoleInterest для пары
        `(user, project_role)` уже существует, новое application по этой же паре
        в MVP не создаётся, включая historical состояния `accepted` и `rejected`.
        Anonymous пользователь должен пройти auth-flow; прямой вызов возвращает 401.
      operationId: createProjectApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserApplicationCard'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/v1/projects/{project_id}/invitations/:
    get:
      tags: [Projects]
      summary: Исходящие приглашения проекта
      description: Owner получает pending RoleInterest(source=invitation) по конкретному проекту.
      operationId: listProjectInvitations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Список приглашений проекта
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInvitationCard'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Projects]
      summary: Пригласить пользователя в проект
      description: |
        Owner приглашает пользователя. Backend определяет подходящую ProjectRole по
        специализации приглашённого пользователя. Если RoleInterest для пары
        `(user, project_role)` уже существует, новое invitation по этой же паре
        в MVP не создаётся, включая historical состояния `accepted` и `rejected`.
      operationId: createProjectInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInvitationCreateRequest'
            example:
              user_id: 2
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvitationCard'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/v1/project-roles/:
    get:
      tags: [Project Roles]
      summary: Список ролей проектов
      operationId: listProjectRoles
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
        - name: specialization_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRolesListResponse'
    post:
      tags: [Project Roles]
      summary: Создать роль проекта
      description: |
        Создаёт роль/направление внутри проекта. Наличие роли означает, что по ней
        можно откликаться и приглашать. В одном проекте не может быть две ProjectRole
        с одной specialization; это не ограничивает число active participants на одной роли.
      operationId: createProjectRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRoleCreateRequest'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-roles/{role_id}/:
    get:
      tags: [Project Roles]
      summary: Получить роль проекта
      operationId: retrieveProjectRole
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Роль проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    patch:
      tags: [Project Roles]
      summary: Изменить роль проекта
      description: |
        В одном проекте не может быть две ProjectRole с одной specialization.
        Одна ProjectRole может иметь сколько угодно active participants.
      operationId: updateProjectRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRoleUpdateRequest'
      responses:
        '200':
          description: Роль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    delete:
      tags: [Project Roles]
      summary: Удалить роль проекта
      description: |
        Удаление запрещено, если по роли есть active ProjectMembership или pending RoleInterest.
        Если по роли есть только исторические rejected/accepted RoleInterest или
        left/removed ProjectMembership, они удаляются каскадно вместе с ролью.
        История по удалённой роли в MVP не сохраняется.
      operationId: deleteProjectRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '204':
          description: Роль удалена
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/role-interests/{interest_id}/accept/:
    post:
      tags: [Role Interests]
      summary: Принять заявку или приглашение
      description: |
        Для source=application действие выполняет owner проекта.
        Для source=invitation действие выполняет приглашённый пользователь.
        При accept backend создаёт ProjectMembership.
      operationId: acceptRoleInterest
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestIdParam'
      responses:
        '200':
          description: RoleInterest принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInterestActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/v1/role-interests/{interest_id}/reject/:
    post:
      tags: [Role Interests]
      summary: Отклонить заявку или приглашение
      description: |
        Для source=application действие выполняет owner проекта.
        Для source=invitation действие выполняет приглашённый пользователь.
        При reject ProjectMembership не создаётся.
      operationId: rejectRoleInterest
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestIdParam'
      responses:
        '200':
          description: RoleInterest отклонён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInterestActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-memberships/{membership_id}/leave/:
    post:
      tags: [Memberships]
      summary: Покинуть проект
      description: Текущий участник завершает своё active участие; статус становится left.
      operationId: leaveProjectMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipIdParam'
      responses:
        '200':
          description: Участие завершено участником
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembershipActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-memberships/{membership_id}/remove/:
    post:
      tags: [Memberships]
      summary: Удалить участника из проекта
      description: Owner проекта завершает active участие пользователя; статус становится removed.
      operationId: removeProjectMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipIdParam'
      responses:
        '200':
          description: Участие завершено owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembershipActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/projects/:
    get:
      tags: [Me]
      summary: Мои проекты
      description: Возвращает active memberships и pending invitations текущего пользователя.
      operationId: listMyProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Проекты текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProjectsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/applications/:
    get:
      tags: [Me]
      summary: Мои заявки
      description: Возвращает RoleInterest(source=application) текущего пользователя.
      operationId: listMyApplications
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RoleInterestStatus'
      responses:
        '200':
          description: Список заявок текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrentUserApplicationCard'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/notifications/:
    get:
      tags: [Me]
      summary: Уведомления текущего пользователя
      description: |
        Read-only представление pending RoleInterest: для participant это invitations,
        для owner это applications на его проекты. Отдельная Notification-модель не создаётся.
      operationId: listMyNotifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationCard'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/portfolio-works/:
    get:
      tags: [Me]
      summary: Мои работы портфолио
      operationId: listMyPortfolioWorks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Работы портфолио
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioWork'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Me]
      summary: Добавить работу портфолио
      operationId: createMyPortfolioWork
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioWorkCreateRequest'
      responses:
        '201':
          description: Работа портфолио создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioWork'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/portfolio-works/{portfolio_work_id}/:
    patch:
      tags: [Me]
      summary: Изменить работу портфолио
      operationId: updateMyPortfolioWork
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PortfolioWorkIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioWorkUpdateRequest'
      responses:
        '200':
          description: Работа портфолио обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioWork'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    delete:
      tags: [Me]
      summary: Удалить работу портфолио
      operationId: deleteMyPortfolioWork
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PortfolioWorkIdParam'
      responses:
        '204':
          description: Работа портфолио удалена
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/favorite-projects/:
    get:
      tags: [Me]
      summary: Избранные проекты
      operationId: listMyFavoriteProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список избранных проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteProject'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Me]
      summary: Добавить проект в избранное
      operationId: createFavoriteProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteProjectCreateRequest'
      responses:
        '201':
          description: Проект добавлен в избранное
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteProjectCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/v1/users/me/favorite-projects/{project_id}/:
    delete:
      tags: [Me]
      summary: Удалить проект из избранного
      operationId: deleteFavoriteProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '204':
          description: Проект удалён из избранного
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
    RoleIdParam:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
    InterestIdParam:
      name: interest_id
      in: path
      required: true
      schema:
        type: integer
    MembershipIdParam:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
    PortfolioWorkIdParam:
      name: portfolio_work_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    ValidationErrorResponse:
      description: Ошибка валидации или недоступное состояние ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    UnauthorizedResponse:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    ForbiddenResponse:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    NotFoundResponse:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    ConflictResponse:
      description: Конфликт бизнес-правил
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'

  schemas:
    AccountType:
      type: string
      enum: [participant, owner]
    UserLevel:
      type: string
      enum: [junior, middle, senior]
    WorkFormat:
      type: string
      enum: [remote, hybrid]
    EmploymentType:
      type: string
      enum: [full_time, part_time, combined]
    SearchStatus:
      type: string
      enum: [looking_for_team, looking_for_members, not_looking]
    ProfileVisibility:
      type: string
      enum: [public, matched_only, hidden]
    Period:
      type: string
      enum: [day, week, month, year]
    UserSkillLevel:
      type: string
      enum: [basic, middle, advanced]
    ProjectStatus:
      type: string
      enum: [open, closed]
    RoleInterestStatus:
      type: string
      enum: [pending, accepted, rejected]
    RoleInterestSource:
      type: string
      enum: [application, invitation]
    ProjectMembershipStatus:
      type: string
      enum: [active, left, removed]

    DetailMessage:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    SocialLinks:
      type: object
      additionalProperties: false
      properties:
        instagram:
          type: string
        telegram:
          type: string
        github:
          type: string
        behance:
          type: string
        vk:
          type: string

    Skill:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SkillCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    Field:
      type: object
      required: [id, name, created_at, updated_at]
      description: |
        Публичное представление системной области. Админские поля `is_featured`
        и `featured_order` используются для подборок, но не отдаются здесь.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Specialization:
      type: object
      required: [id, field_id, name, created_at, updated_at]
      description: Публичное представление системной специализации.
      properties:
        id:
          type: integer
          readOnly: true
        field_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    UserSkill:
      type: object
      required: [id, user_id, skill_id, name, level, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        skill_id:
          type: integer
        name:
          type: string
          readOnly: true
        level:
          $ref: '#/components/schemas/UserSkillLevel'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    UserSkillInput:
      type: object
      required: [skill_id, level]
      properties:
        skill_id:
          type: integer
        level:
          $ref: '#/components/schemas/UserSkillLevel'

    PortfolioWork:
      type: object
      required: [id, user_id, title, task, solution, image, technologies, link, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        title:
          type: string
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PortfolioWorkCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          format: uri
          nullable: true
    PortfolioWorkUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          format: uri
          nullable: true

    AuthUser:
      type: object
      required: [id, username, display_name, account_type]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Логин пользователя для входа.
        display_name:
          type: string
          description: Отображаемое имя пользователя в интерфейсе.
        account_type:
          $ref: '#/components/schemas/AccountType'
    TokenLoginRequest:
      type: object
      required: [username, password]
      description: Login выполняется по username и password. Email не является login identifier в MVP.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    TokenPairResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenRefreshResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    UserListItem:
      type: object
      required: [id, username, display_name, avatar, specialization_id, specialization_name, level, city, workload_hours_per_week, work_format, employment_type, skills, search_status]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Логин пользователя для входа.
        display_name:
          type: string
          description: Отображаемое имя пользователя в интерфейсе.
        avatar:
          type: string
          format: uri
          nullable: true
        specialization_id:
          type: integer
          nullable: true
        specialization_name:
          type: string
          nullable: true
          readOnly: true
        level:
          allOf:
            - $ref: '#/components/schemas/UserLevel'
          nullable: true
        city:
          type: string
          nullable: true
        workload_hours_per_week:
          type: integer
          nullable: true
        work_format:
          allOf:
            - $ref: '#/components/schemas/WorkFormat'
          nullable: true
        employment_type:
          allOf:
            - $ref: '#/components/schemas/EmploymentType'
          nullable: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkill'
        search_status:
          allOf:
            - $ref: '#/components/schemas/SearchStatus'
          nullable: true
    UserPublic:
      type: object
      required:
        - id
        - username
        - display_name
        - bio
        - specialization_id
        - specialization_name
        - level
        - workload_hours_per_week
        - work_format
        - employment_type
