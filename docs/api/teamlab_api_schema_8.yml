openapi: 3.0.3
info:
  title: TeamLab API
  version: 1.3.0
  description: |
    API MVP-платформы TeamLab.

    Канонический поток домена:
    Project -> ProjectRole -> RoleInterest -> ProjectMembership.

    ProjectRole описывает роль, специализацию или направление внутри проекта.
    На одну роль может быть несколько участников. Заявки и приглашения представлены
    RoleInterest с source = application или source = invitation. ProjectMembership
    создаётся только при accept RoleInterest. Notifications в MVP являются read-only
    представлением pending RoleInterest и не имеют отдельной модели.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Auth
    description: JWT-аутентификация
  - name: Users
    description: Пользователи и публичные профили
  - name: Me
    description: Ресурсы текущего пользователя
  - name: Skills
    description: Справочник навыков
  - name: Specializations
    description: Справочник специализаций
  - name: Fields
    description: Справочник областей
  - name: Projects
    description: Проекты, заявки и приглашения внутри проекта
  - name: Project Roles
    description: Роли и направления проекта
  - name: Role Interests
    description: Action endpoints для заявок и приглашений
  - name: Memberships
    description: Action endpoints для завершения участия
  - name: Images
    description: Прямая загрузка, обработка и привязка изображений

paths:
  /api/v1/:
    get:
      summary: Корень API
      description: Автоматический discovery endpoint DRF DefaultRouter со ссылками на основные коллекции.
      operationId: apiRoot
      responses:
        '200':
          description: Карта основных collection endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'

  /api/v1/auth/token/login/:
    post:
      tags: [Auth]
      summary: Получить JWT-токены
      description: Авторизация по username и паролю. Email сохраняется как контактное/будущее поле, но не является login identifier в MVP.
      operationId: tokenLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenLoginRequest'
            example:
              username: ivan_backend
              password: current-password-2026
      responses:
        '200':
          description: Токены выданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/auth/token/refresh/:
    post:
      tags: [Auth]
      summary: Обновить access- и refresh-токены
      operationId: tokenRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Access- и refresh-токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/auth/token/blacklist/:
    post:
      tags: [Auth]
      summary: Выйти из текущей сессии
      description: |
        Добавляет переданный refresh-токен в blacklist. После успешного ответа
        refresh-токен нельзя использовать для получения новой пары токенов.
        Связанный access-токен не отзывается и остаётся действительным до истечения
        его срока жизни. Другие refresh-токены пользователя не затрагиваются.

        После запроса frontend должен удалить локально сохранённые access- и
        refresh-токены, в том числе если refresh-токен уже просрочен или отозван.
      operationId: tokenBlacklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
      responses:
        '200':
          description: Refresh-токен отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
              example: {}
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          description: Refresh-токен невалиден, просрочен или уже отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'

  /api/v1/users/:
    get:
      tags: [Users]
      summary: Список пользователей
      description: |
        Публичный список безопасных карточек пользователей. Email, notification settings
        и приватные контакты не возвращаются. Поиск в хедере раздела участников
        использует `GET /api/v1/users/?search=...`; отдельный глобальный `/search/`
        endpoint в MVP не добавляется.

        `field_ids`, `specialization_ids` и `skill_ids` принимают comma-separated
        lists и работают как OR внутри своей группы. Разные группы фильтров
        применяются совместно.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Поиск по username, display_name, bio, city, названию специализации и навыкам.
          schema:
            type: string
        - name: account_type
          in: query
          description: Фильтр по типу аккаунта пользователя.
          schema:
            $ref: '#/components/schemas/AccountType'
        - name: field_id
          in: query
          description: "Фильтр через `user.specialization.field_id`."
          schema:
            type: integer
        - name: field_ids
          in: query
          description: Comma-separated list ID областей через `user.specialization.field_id`. OR внутри группы.
          schema:
            type: string
        - name: specialization_ids
          in: query
          description: Comma-separated list ID специализаций пользователя. OR внутри группы.
          schema:
            type: string
        - name: skill_ids
          in: query
          description: Comma-separated list ID навыков пользователя. OR внутри группы.
          schema:
            type: string
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/UserLevel'
        - name: city
          in: query
          schema:
            type: string
        - name: work_format
          in: query
          schema:
            $ref: '#/components/schemas/WorkFormat'
        - name: employment_type
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentType'
        - name: search_status
          in: query
          schema:
            $ref: '#/components/schemas/SearchStatus'
        - name: ordering
          in: query
          description: |
            Сортировка по `created_at`, `updated_at` или `username`.
            Пример: `ordering=-created_at`.
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: 2
                    username: ivan_backend
                    display_name: Иван Backend
                    avatar: https://cdn.teamlab.example/avatars/ivan_backend.png
                    specialization_id: 1
                    specialization_name: Backend-разработчик
                    level: middle
                    city: Санкт-Петербург
                    workload_hours_per_week: 20
                    work_format: remote
                    employment_type: part_time
                    skills:
                      - id: 1
                        user_id: 2
                        skill_id: 1
                        name: Python
                        level: advanced
                        created_at: '2026-03-12T09:20:00Z'
                        updated_at: '2026-04-01T10:00:00Z'
                    search_status: looking_for_team
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Users]
      summary: Регистрация пользователя
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: maria_ux
              display_name: Мария UX
              email: maria.ux@example.com
              password: strong-password-2026
              account_type: participant
              specialization_id: 2
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/users/{user_id}/:
    get:
      tags: [Users]
      summary: Публичный профиль пользователя
      description: Возвращает публичную информацию. account_type не отдаётся в публичном профиле.
      operationId: retrieveUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Публичный профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/:
    get:
      tags: [Me]
      summary: Текущий пользователь
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    patch:
      tags: [Me]
      summary: Изменить профиль текущего пользователя
      description: |
        Participant не может убрать или изменить `specialization_id`, если у него есть
        active ProjectMembership, pending RoleInterest(source=application) или pending
        RoleInterest(source=invitation). Historical states (`rejected`, `accepted`,
        `left`, `removed`) сами по себе не блокируют смену specialization.
        Поле `avatar` сохраняет legacy-контракт Base64; `null` удаляет текущий
        локальный или S3-аватар и запускает асинхронную очистку S3.
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/avatar/:
    put:
      tags: [Me]
      summary: Загрузить или заменить аватар через Base64
      description: |
        Legacy-эндпойнт. Принимает data URL в поле `avatar`. Если до этого был
        привязан готовый `ImageUpload`, он переводится в `superseded`, а его
        объекты удаляются фоновой задачей. Для новой прямой загрузки используйте
        поток `/image-uploads/` и `attach`.
      operationId: uploadCurrentUserAvatar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUpdateRequest'
      responses:
        '200':
          description: Аватар сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    delete:
      tags: [Me]
      summary: Удалить или отвязать текущий аватар
      description: |
        Удаляет локальный Base64-аватар либо отвязывает S3-изображение текущего
        пользователя. Повторный вызов допустим; очистка S3 выполняется асинхронно.
      operationId: deleteCurrentUserAvatar
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Аватар удалён
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/image-uploads/:
    post:
      tags: [Images]
      summary: Создать сессию прямой загрузки изображения
      description: |
        Создаёт принадлежащую текущему пользователю upload-сессию и возвращает
        параметры presigned POST для прямой загрузки в Yandex Object Storage.
        `target_id` запрещён для `user_avatar`, обязателен для `project_image`
        и `portfolio_image` и должен указывать на принадлежащую пользователю
        сущность. Допустимы JPEG, PNG и WebP. Лимит: 1 МиБ для аватара и 2 МиБ
        для изображения проекта или портфолио. Сессия действует 5 минут.

        Клиент должен добавить в `multipart/form-data` все пары из
        `upload_fields`, затем файл в поле `file`, и отправить форму точно на
        `upload_url`. После успешного ответа Object Storage вызовите `confirm`.
      operationId: createImageUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadCreateRequest'
      responses:
        '201':
          description: Сессия и параметры presigned POST созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '503':
          $ref: '#/components/responses/StorageUnavailableResponse'

  /api/v1/image-uploads/{upload_id}/:
    get:
      tags: [Images]
      summary: Получить статус обработки изображения
      description: |
        Polling доступен только владельцу upload-сессии. Для `queued` и
        `processing` повторяйте запрос. В статусе `ready` доступны временные
        подписанные `image_url` и `thumbnail_url`; в `failed` смотрите
        `error_code` и `error_message`. URL действуют 1 час и должны считаться
        непрозрачными временными значениями.
      operationId: retrieveImageUpload
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageUploadIdParam'
      responses:
        '200':
          description: Статус и signed URLs готового изображения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '503':
          $ref: '#/components/responses/StorageUnavailableResponse'

  /api/v1/image-uploads/{upload_id}/confirm/:
    post:
      tags: [Images]
      summary: Подтвердить завершение прямой загрузки
      description: |
        Тело запроса не требуется. Backend выполняет HEAD объекта и сверяет
        фактические размер и Content-Type с create-запросом и лимитом типа.
        Успешный переход `awaiting_upload -> queued` публикует Celery-задачу
        после commit. Повторный confirm в `queued` идемпотентен. Ответ `400`
        возвращается, если объект ещё не загружен, сессия истекла, статус не
        допускает confirm либо метаданные не совпали.
      operationId: confirmImageUpload
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageUploadIdParam'
      responses:
        '200':
          description: Изображение поставлено в очередь обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadConfirmResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '503':
          $ref: '#/components/responses/StorageUnavailableResponse'

  /api/v1/image-uploads/{upload_id}/attach/:
    post:
      tags: [Images]
      summary: Привязать готовое изображение или заменить текущее
      description: |
        Тело запроса не требуется. Разрешено только владельцу upload-сессии и
        текущему владельцу целевой сущности. `kind` и цель фиксируются при
        create и повторно проверяются. Загрузка должна иметь статус `ready`.
        Успешный переход `ready -> attached` заменяет текущее изображение;
        прежнее S3-изображение переводится в `superseded` и удаляется фоновой
        задачей. Повторный attach уже привязанной загрузки идемпотентен.
      operationId: attachImageUpload
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageUploadIdParam'
      responses:
        '200':
          description: Изображение привязано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadStatus'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '503':
          $ref: '#/components/responses/StorageUnavailableResponse'

  /api/v1/users/set_password/:
    post:
      tags: [Me]
      summary: Изменить пароль текущего пользователя
      operationId: setCurrentUserPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/skills/:
    get:
      tags: [Skills]
      summary: Список навыков
      description: |
        Публичный системный справочник навыков. Skill управляется через админку,
        seed или служебные инструменты; публичного create-сценария нет.

        `field_ids` принимает comma-separated list ID областей и работает как OR
        внутри группы. Навык, связанный с несколькими выбранными областями,
        не дублируется в выдаче.
      operationId: listSkills
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: ordering
          in: query
          description: Сортировка по `name` или `created_at`; префикс `-` задаёт обратный порядок.
          schema:
            type: string
        - name: field_ids
          in: query
          description: Comma-separated list ID областей, связанных с навыком. OR внутри группы.
          schema:
            type: string
      responses:
        '200':
          description: Список навыков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/specializations/:
    get:
      tags: [Specializations]
      summary: Список специализаций
      description: |
        Публичный системный справочник специализаций. Specialization управляется
        через админку, seed или служебные инструменты; пользователь не создаёт
        specializations через публичный API.
      operationId: listSpecializations
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: field_id
          in: query
          schema:
            type: integer
        - name: ordering
          in: query
          description: Сортировка по `name` или `created_at`; префикс `-` задаёт обратный порядок.
          schema:
            type: string
      responses:
        '200':
          description: Список специализаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialization'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'

  /api/v1/fields/:
    get:
      tags: [Fields]
      summary: Список областей
      description: |
        Публичный системный справочник областей. Field управляется через админку,
        seed или служебные инструменты; пользователь не создаёт fields через публичный API.
        Синтетическая карточка "Все профили" не является записью Field в базе.
      operationId: listFields
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: ordering
          in: query
          description: Сортировка по `name` или `created_at`; префикс `-` задаёт обратный порядок.
          schema:
            type: string
      responses:
        '200':
          description: Список областей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /api/v1/fields/featured/:
    get:
      tags: [Fields]
      summary: Области для главной
      description: |
        Публичный endpoint для блока на главной. Возвращает Field с
        `is_featured = true`, порядок: `featured_order`, затем `name`.
        `is_featured` и `featured_order` управляются администратором через
        админку/служебные инструменты. `featured_order` не отдаётся в публичном response.
      operationId: listFeaturedFields
      responses:
        '200':
          description: Featured области
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /api/v1/projects/:
    get:
      tags: [Projects]
      summary: Список проектов
      description: |
        Публичный список проектов с `roles_preview`. Поиск в хедере раздела проектов
        использует `GET /api/v1/projects/?search=...`.

        `field_ids`, `specialization_ids` и `skill_ids` принимают comma-separated
        lists и работают как OR внутри своей группы. Разные группы фильтров
        применяются совместно. Проекты не дублируются из-за совпадений в
        нескольких ролях или навыках.
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          description: Поиск по названию, описанию, проблеме, области, специализациям ролей и навыкам ролей проекта.
          schema:
            type: string
        - name: status
          in: query
          description: Фильтр по статусу проекта.
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: field_id
          in: query
          description: Фильтр по области проекта.
          schema:
            type: integer
        - name: field_ids
          in: query
          description: Comma-separated list ID областей проекта. OR внутри группы.
          schema:
            type: string
        - name: specialization_ids
          in: query
          description: Comma-separated list ID специализаций ролей проекта. OR внутри группы.
          schema:
            type: string
        - name: skill_ids
          in: query
          description: Comma-separated list ID навыков, требуемых в ролях проекта. OR внутри группы.
          schema:
            type: string
        - name: ordering
          in: query
          description: |
            Сортировка по `created_at`, `updated_at` или `title`.
            Пример: `ordering=-created_at`.
          schema:
            type: string
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Projects]
      summary: Создать проект с ролями
      description: |
        Создаёт проект и вложенные роли. `roles` обязателен и должен содержать
        минимум одну роль. В одном проекте не может быть две ProjectRole с одной
        specialization. В `skills` каждой роли не могут повторяться `skill_id`
        или `order`; `order` начинается с 1. `is_featured` и `featured_order`
        не принимаются публичным API и управляются администратором через
        админку/служебные инструменты.
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            example:
              field_id: 1
              title: Планировщик учебных встреч
              description: Веб-платформа для планирования учебных групп и воркшопов.
              problem: Студенческим сообществам сложно быстро находить участников.
              image: null
              roles:
                - specialization_id: 1
                  tasks:
                    - Разработать REST API проекта.
                  benefits:
                    - Практика backend-разработки.
                  skills:
                    - skill_id: 1
                      description: Python backend.
                      order: 1
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

  /api/v1/projects/featured/:
    get:
      tags: [Projects]
      summary: Проекты недели
      description: |
        Публичный endpoint для блока "Проекты недели" на главной. Использует ту же
        response schema, что `GET /api/v1/projects/`. Возвращает проекты с
        `is_featured = true`, порядок: `featured_order`, затем `-created_at`.
        `is_featured` и `featured_order` управляются администратором; `featured_order`
        не отдаётся в публичном response и не принимается публичным create/update API.
      operationId: listFeaturedProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Featured проекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/projects/{project_id}/:
    get:
      tags: [Projects]
      summary: Детали проекта
      description: |
        Детальная карточка проекта содержит roles и контекст текущего пользователя;
        roles_preview здесь не возвращается. Для anonymous пользователя context fields
        возвращаются как `null`: `matching_role_id`, `matching_role_name`,
        `my_interest_id`, `my_interest_status`, `my_interest_source`,
        `my_membership_id`, `my_membership_status`.
      operationId: retrieveProject
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Детали проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    patch:
      tags: [Projects]
      summary: Изменить проект
      description: |
        Обновляет публично редактируемые поля проекта. `is_featured` и
        `featured_order` не принимаются публичным API и управляются администратором
        через админку/служебные инструменты. Поле `image` сохраняет legacy-контракт
        Base64; новое значение заменяет текущее S3-изображение, а `null` удаляет его.
      operationId: updateProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Проект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/projects/{project_id}/image/:
    delete:
      tags: [Projects]
      summary: Отвязать текущее изображение проекта
      description: |
        Доступно только владельцу проекта. Удаляет локальное изображение либо
        отвязывает текущий `ImageUpload`; S3-объекты удаляются асинхронно.
        Сам проект не удаляется.
      operationId: deleteProjectImage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '204':
          description: Изображение отвязано, очистка поставлена в очередь
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/projects/{project_id}/applications/:
    get:
      tags: [Projects]
      summary: Входящие заявки проекта
      description: Owner получает pending RoleInterest(source=application) по конкретному проекту с вложенной карточкой пользователя.
      operationId: listProjectApplications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Список заявок проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectApplications'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Projects]
      summary: Откликнуться на проект
      description: |
        Participant создаёт заявку. Backend определяет подходящую ProjectRole по
        специализации текущего пользователя. Если RoleInterest для пары
        `(user, project_role)` уже существует, новое application по этой же паре
        в MVP не создаётся, включая historical состояния `accepted` и `rejected`.
        Anonymous пользователь должен пройти auth-flow; прямой вызов возвращает 401.
      operationId: createProjectApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserApplicationCard'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/projects/{project_id}/invitations/:
    get:
      tags: [Projects]
      summary: Исходящие приглашения проекта
      description: Owner получает pending RoleInterest(source=invitation) по конкретному проекту.
      operationId: listProjectInvitations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Список приглашений проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectInvitations'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    post:
      tags: [Projects]
      summary: Пригласить пользователя в проект
      description: |
        Owner приглашает пользователя. Backend определяет подходящую ProjectRole по
        специализации приглашённого пользователя. Если RoleInterest для пары
        `(user, project_role)` уже существует, новое invitation по этой же паре
        в MVP не создаётся, включая historical состояния `accepted` и `rejected`.
      operationId: createProjectInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInvitationCreateRequest'
            example:
              user_id: 2
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvitationCard'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-roles/:
    get:
      tags: [Project Roles]
      summary: Список ролей проектов
      description: |
        Непагинированный список ролей. `project_id` и `specialization_id`
        можно передавать одновременно; в этом случае применяются оба фильтра.
      operationId: listProjectRoles
      parameters:
        - name: project_id
          in: query
          description: Фильтр по ID проекта.
          schema:
            type: integer
        - name: specialization_id
          in: query
          description: Фильтр по ID специализации роли.
          schema:
            type: integer
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRole'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
    post:
      tags: [Project Roles]
      summary: Создать роль проекта
      description: |
        Создаёт роль/направление внутри проекта. Наличие роли означает, что по ней
        можно откликаться и приглашать. В одном проекте не может быть две ProjectRole
        с одной specialization; это не ограничивает число active participants на одной роли.
        В `skills` не могут повторяться `skill_id` или `order`; `order` начинается с 1.
      operationId: createProjectRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRoleCreateRequest'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

  /api/v1/project-roles/{role_id}/:
    get:
      tags: [Project Roles]
      summary: Получить роль проекта
      operationId: retrieveProjectRole
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '200':
          description: Роль проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    patch:
      tags: [Project Roles]
      summary: Изменить роль проекта
      description: |
        В одном проекте не может быть две ProjectRole с одной specialization.
        Одна ProjectRole может иметь сколько угодно active participants.
        В `skills` не могут повторяться `skill_id` или `order`; `order` начинается с 1.
      operationId: updateProjectRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRoleUpdateRequest'
      responses:
        '200':
          description: Роль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRole'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    delete:
      tags: [Project Roles]
      summary: Удалить роль проекта
      description: |
        Удаление запрещено, если по роли есть active ProjectMembership или pending RoleInterest.
        Если по роли есть только исторические rejected/accepted RoleInterest или
        left/removed ProjectMembership, они удаляются каскадно вместе с ролью.
        История по удалённой роли в MVP не сохраняется.
      operationId: deleteProjectRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdParam'
      responses:
        '204':
          description: Роль удалена
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/role-interests/{interest_id}/accept/:
    post:
      tags: [Role Interests]
      summary: Принять заявку или приглашение
      description: |
        Для source=application действие выполняет owner проекта.
        Для source=invitation действие выполняет приглашённый пользователь.
        При accept backend создаёт ProjectMembership.
      operationId: acceptRoleInterest
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestIdParam'
      responses:
        '200':
          description: RoleInterest принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInterestActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/role-interests/{interest_id}/reject/:
    post:
      tags: [Role Interests]
      summary: Отклонить заявку или приглашение
      description: |
        Для source=application действие выполняет owner проекта.
        Для source=invitation действие выполняет приглашённый пользователь.
        При reject ProjectMembership не создаётся.
      operationId: rejectRoleInterest
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestIdParam'
      responses:
        '200':
          description: RoleInterest отклонён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInterestActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-memberships/{membership_id}/leave/:
    post:
      tags: [Memberships]
      summary: Покинуть проект
      description: Текущий участник завершает своё active участие; статус становится left.
      operationId: leaveProjectMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipIdParam'
      responses:
        '200':
          description: Участие завершено участником
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembershipActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/project-memberships/{membership_id}/remove/:
    post:
      tags: [Memberships]
      summary: Удалить участника из проекта
      description: Owner проекта завершает active участие пользователя; статус становится removed.
      operationId: removeProjectMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MembershipIdParam'
      responses:
        '200':
          description: Участие завершено owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembershipActionResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/projects/:
    get:
      tags: [Me]
      summary: Мои проекты
      description: Возвращает active memberships и pending invitations текущего пользователя.
      operationId: listMyProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Проекты текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProjectsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/applications/:
    get:
      tags: [Me]
      summary: Мои заявки
      description: |
        Возвращает все RoleInterest(source=application) текущего пользователя.
        Без `status` в выдачу входят `pending`, `accepted` и `rejected`;
        параметр `status` фильтрует список по одному из этих значений.
      operationId: listMyApplications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Фильтр по статусу заявки. Неизвестное значение возвращает 400.
          schema:
            $ref: '#/components/schemas/RoleInterestStatus'
      responses:
        '200':
          description: Список заявок текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCurrentUserApplications'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/notifications/:
    get:
      tags: [Me]
      summary: Уведомления текущего пользователя
      description: |
        Read-only представление pending RoleInterest: для participant это invitations,
        для owner это applications на его проекты. Отдельная Notification-модель не создаётся.
      operationId: listMyNotifications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/portfolio-works/:
    get:
      tags: [Me]
      summary: Мои работы портфолио
      operationId: listMyPortfolioWorks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Работы портфолио
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioWork'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Me]
      summary: Добавить работу портфолио
      description: Поле `image` необязательно и сохраняет legacy-формат Base64.
      operationId: createMyPortfolioWork
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioWorkCreateRequest'
      responses:
        '201':
          description: Работа портфолио создана (ответ write-serializer без user_id и timestamps)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioWorkWriteResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/users/me/portfolio-works/{portfolio_work_id}/:
    patch:
      tags: [Me]
      summary: Изменить работу портфолио
      description: |
        Поле `image` сохраняет legacy-контракт Base64; новое значение заменяет
        текущее S3-изображение, а `null` удаляет его.
      operationId: updateMyPortfolioWork
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PortfolioWorkIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioWorkUpdateRequest'
      responses:
        '200':
          description: Работа портфолио обновлена (ответ write-serializer без user_id и timestamps)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioWorkWriteResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    delete:
      tags: [Me]
      summary: Удалить работу портфолио
      description: |
        Удаляет саму работу и её локальное либо S3-изображение. Очистка S3
        выполняется асинхронно.
      operationId: deleteMyPortfolioWork
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PortfolioWorkIdParam'
      responses:
        '204':
          description: Работа портфолио удалена
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/portfolio-works/{portfolio_work_id}/image/:
    delete:
      tags: [Me]
      summary: Отвязать изображение работы портфолио
      description: |
        Доступно только владельцу работы портфолио. Удаляет локальное изображение
        либо отвязывает текущий `ImageUpload`; S3-объекты удаляются асинхронно.
        Сама работа портфолио не удаляется.
      operationId: deleteMyPortfolioWorkImage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PortfolioWorkIdParam'
      responses:
        '204':
          description: Изображение отвязано, очистка поставлена в очередь
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/users/me/favorite-projects/:
    get:
      tags: [Me]
      summary: Избранные проекты
      operationId: listMyFavoriteProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список избранных проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteProject'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
    post:
      tags: [Me]
      summary: Добавить проект в избранное
      operationId: createFavoriteProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteProjectCreateRequest'
      responses:
        '201':
          description: Проект добавлен в избранное
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteProjectCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

  /api/v1/users/me/favorite-projects/{project_id}/:
    delete:
      tags: [Me]
      summary: Удалить проект из избранного
      operationId: deleteFavoriteProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '204':
          description: Проект удалён из избранного
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Размер страницы. Значения больше 100 ограничиваются backend до 100.
      schema:
        type: integer
        minimum: 1
        default: 10
        maximum: 100
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
    RoleIdParam:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
    InterestIdParam:
      name: interest_id
      in: path
      required: true
      schema:
        type: integer
    MembershipIdParam:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
    PortfolioWorkIdParam:
      name: portfolio_work_id
      in: path
      required: true
      schema:
        type: integer
    ImageUploadIdParam:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationErrorResponse:
      description: Ошибка валидации или недоступное состояние ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    UnauthorizedResponse:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    ForbiddenResponse:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    NotFoundResponse:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
    StorageUnavailableResponse:
      description: Yandex Object Storage временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DetailMessage'
          example:
            detail: Хранилище временно недоступно.
  schemas:
    ImageUploadKind:
      type: string
      enum: [user_avatar, project_image, portfolio_image]
      description: |
        `user_avatar` — аватар текущего пользователя; `project_image` —
        изображение проекта; `portfolio_image` — изображение работы портфолио.
    ImageUploadStatusValue:
      type: string
      enum:
        - awaiting_upload
        - queued
        - processing
        - ready
        - attached
        - failed
        - expired
        - superseded
      description: |
        `awaiting_upload` — ожидается POST в S3; `queued` — задача поставлена
        в очередь; `processing` — файл обрабатывается; `ready` — можно вызвать
        attach; `attached` — изображение привязано; `failed` — обработка
        завершилась ошибкой; `expired` — зарезервированный статус истёкшей
        сессии (сейчас просроченный confirm возвращает `400` без перехода);
        `superseded` — изображение заменено или отвязано и ожидает/завершило
        очистку.
    ImageUploadCreateRequest:
      type: object
      required: [kind, content_type, size_bytes]
      properties:
        kind:
          $ref: '#/components/schemas/ImageUploadKind'
        target_id:
          type: integer
          minimum: 1
          description: Обязателен для проекта и портфолио, запрещён для аватара.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: MIME-тип исходного файла и обязательное значение поля Content-Type в presigned POST.
        size_bytes:
          type: integer
          minimum: 1
          maximum: 2097152
          description: |
            Точный размер исходного файла в байтах. Максимум 1048576 для
            `user_avatar` и 2097152 для `project_image`/`portfolio_image`.
      example:
        kind: project_image
        target_id: 42
        content_type: image/jpeg
        size_bytes: 734003
    ImageUploadCreateResponse:
      type: object
      required:
        - upload_id
        - status
        - expires_at
        - upload_url
        - upload_fields
      properties:
        upload_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImageUploadStatusValue'
        expires_at:
          type: string
          format: date-time
        upload_url:
          type: string
          format: uri
        upload_fields:
          type: object
          description: Непрозрачный набор полей; каждую пару нужно без изменений добавить в FormData перед полем `file`.
          additionalProperties:
            type: string
      example:
        upload_id: 1e575f20-a5d2-4cd6-92cf-728f817a34df
        status: awaiting_upload
        expires_at: '2026-11-03T12:05:00Z'
        upload_url: https://storage.yandexcloud.net/teamlab-media
        upload_fields:
          Content-Type: image/jpeg
          key: temporary/1e575f20-a5d2-4cd6-92cf-728f817a34df/image
          policy: opaque-signed-policy
    ImageUploadConfirmResponse:
      type: object
      required: [upload_id, status]
      properties:
        upload_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImageUploadStatusValue'
      example:
        upload_id: 1e575f20-a5d2-4cd6-92cf-728f817a34df
        status: queued
    ImageUploadStatus:
      type: object
      required:
        - upload_id
        - kind
        - status
        - image_url
        - thumbnail_url
        - error_code
        - error_message
      properties:
        upload_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ImageUploadKind'
        status:
          $ref: '#/components/schemas/ImageUploadStatusValue'
        image_url:
          type: string
          format: uri
          nullable: true
          description: Signed URL основного WebP; доступен только в `ready` и `attached`, действует 1 час.
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Signed URL WebP-миниатюры 256x256; доступен только в `ready` и `attached`, действует 1 час.
        error_code:
          type: string
          nullable: true
          description: Машиночитаемый код ошибки обработки; обычно заполнен только при `failed`.
        error_message:
          type: string
          description: Сообщение об ошибке обработки или пустая строка.
      example:
        upload_id: 1e575f20-a5d2-4cd6-92cf-728f817a34df
        kind: project_image
        status: ready
        image_url: https://storage.yandexcloud.net/teamlab-media/media/example/original.webp?X-Amz-Signature=...
        thumbnail_url: https://storage.yandexcloud.net/teamlab-media/media/example/thumbnail.webp?X-Amz-Signature=...
        error_code: null
        error_message: ''

    ApiRoot:
      type: object
      required: [skills, fields, specializations, projects, project-roles, users]
      properties:
        skills:
          type: string
          format: uri
        fields:
          type: string
          format: uri
        specializations:
          type: string
          format: uri
        projects:
          type: string
          format: uri
        project-roles:
          type: string
          format: uri
        users:
          type: string
          format: uri

    AccountType:
      type: string
      enum: [participant, owner]
    UserLevel:
      type: string
      description: Пустая строка также принимается полем профиля из-за `blank=True` в текущей модели.
      enum: [junior, middle, senior, '']
    WorkFormat:
      type: string
      description: Пустая строка также принимается полем профиля из-за `blank=True` в текущей модели.
      enum: [remote, hybrid, '']
    EmploymentType:
      type: string
      description: Пустая строка также принимается полем профиля из-за `blank=True` в текущей модели.
      enum: [full_time, part_time, combined, '']
    SearchStatus:
      type: string
      description: Пустая строка также принимается полем профиля из-за `blank=True` в текущей модели.
      enum: [looking_for_team, looking_for_members, not_looking, '']
    ProfileVisibility:
      type: string
      enum: [public, matched_only, hidden]
    UserSkillLevel:
      type: string
      enum: [basic, middle, advanced]
    ProjectStatus:
      type: string
      enum: [open, closed]
    RoleInterestStatus:
      type: string
      enum: [pending, accepted, rejected]
    RoleInterestSource:
      type: string
      enum: [application, invitation]
    ProjectMembershipStatus:
      type: string
      enum: [active, left, removed]

    DetailMessage:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    TokenError:
      type: object
      required: [detail, code]
      properties:
        detail:
          type: string
        code:
          type: string
          example: token_not_valid
    ValidationError:
      description: |
        Стандартное тело DRF ValidationError. В зависимости от источника ошибки
        корнем может быть объект полей или массив; значения могут быть строками,
        массивами и вложенными объектами.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    SocialLinks:
      type: object
      description: |
        Допустим пустой объект. Значения — произвольные строки без дополнительной
        URL-валидации; неизвестные ключи и `null` отклоняются.
      additionalProperties: false
      properties:
        instagram:
          type: string
        telegram:
          type: string
        github:
          type: string
        behance:
          type: string
        vk:
          type: string

    Skill:
      type: object
      required: [id, name, slug, field_ids, created_at, updated_at]
      description: Публичное представление системного навыка.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        slug:
          type: string
        field_ids:
          type: array
          description: ID областей, связанных с навыком.
          items:
            type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Field:
      type: object
      required: [id, name, created_at, updated_at]
      description: |
        Публичное представление системной области. Админские поля `is_featured`
        и `featured_order` используются для подборок, но не отдаются здесь.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Specialization:
      type: object
      required: [id, field_id, name, created_at, updated_at]
      description: Публичное представление системной специализации.
      properties:
        id:
          type: integer
          readOnly: true
        field_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    UserSkill:
      type: object
      required: [id, user_id, skill_id, name, level, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        skill_id:
          type: integer
        name:
          type: string
          readOnly: true
        level:
          $ref: '#/components/schemas/UserSkillLevel'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    UserSkillInput:
      type: object
      required: [skill_id, level]
      properties:
        skill_id:
          type: integer
        level:
          $ref: '#/components/schemas/UserSkillLevel'

    PortfolioWork:
      type: object
      required: [id, user_id, title, task, solution, image, technologies, link, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        title:
          type: string
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          format: uri
          description: Signed S3 URL либо URL legacy-изображения; значение может изменяться и истекать.
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          nullable: true
          description: Может быть `null` или пустой строкой; непустое значение валидируется backend как URL.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PortfolioWorkCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          description: Необязательный legacy data URL, например `data:image/png;base64,...`.
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          nullable: true
          description: Может быть `null` или пустой строкой; непустое значение валидируется backend как URL.
    PortfolioWorkUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          description: Необязательный legacy data URL; `null` удаляет текущее изображение.
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          nullable: true
          description: Может быть `null` или пустой строкой; непустое значение валидируется backend как URL.

    PortfolioWorkWriteResponse:
      type: object
      description: Фактический ответ PortfolioWorkWriteSerializer для POST и PATCH.
      required: [id, title, task, solution, image, technologies, link]
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        task:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          format: uri
          description: Signed S3 URL либо URL legacy-изображения; значение может изменяться и истекать.
        technologies:
          type: array
          nullable: true
          items:
            type: string
        link:
          type: string
          nullable: true
          description: Может быть `null` или пустой строкой; непустое значение валидируется backend как URL.

    AuthUser:
      type: object
      required: [id, username, display_name, account_type]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Логин пользователя для входа.
        display_name:
          type: string
          description: Отображаемое имя пользователя в интерфейсе.
        account_type:
          $ref: '#/components/schemas/AccountType'
    TokenLoginRequest:
      type: object
      required: [username, password]
      description: Login выполняется по username и password. Email не является login identifier в MVP.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    TokenPairResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenBlacklistRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          writeOnly: true
          description: Refresh-токен текущей сессии.
    EmptyObject:
      type: object
      additionalProperties: false
    TokenRefreshResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    UserListItem:
      type: object
      required: [id, username, display_name, avatar, specialization_id, specialization_name, level, city, workload_hours_per_week, work_format, employment_type, skills, search_status]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Логин пользователя для входа.
        display_name:
          type: string
          description: Отображаемое имя пользователя в интерфейсе.
        avatar:
          type: string
          format: uri
          nullable: true
          description: Signed S3 URL либо URL legacy-аватара; значение может изменяться и истекать.
        specialization_id:
          type: integer
          nullable: true
        specialization_name:
          type: string
          nullable: true
          readOnly: true
        level:
          allOf:
            - $ref: '#/components/schemas/UserLevel'
          nullable: true
        city:
          type: string
          description: Город пользователя. Свободная строка; frontend может предлагать autocomplete-подсказки, но backend не валидирует значение по справочнику.
        workload_hours_per_week:
          type: integer
          nullable: true
          minimum: 1
          maximum: 168
        work_format:
          allOf:
            - $ref: '#/components/schemas/WorkFormat'
          nullable: true
        employment_type:
          allOf:
            - $ref: '#/components/schemas/EmploymentType'
          nullable: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkill'
        search_status:
          allOf:
            - $ref: '#/components/schemas/SearchStatus'
          nullable: true
    UserPublic:
      type: object
      required:
        - id
        - username
        - display_name
        - bio
        - specialization_id
        - specialization_name
        - level
        - workload_hours_per_week
        - work_format
        - employment_type
        - search_status
        - city
        - avatar
        - contacts_visible
        - social_links
        - created_at
        - updated_at
        - skills
        - portfolio_works
        - matching_project_role_id
        - matching_project_role_name
        - project_interest_id
        - project_interest_status
        - project_interest_source
        - project_membership_id
        - project_membership_status
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Логин пользователя для входа.
        display_name:
          type: string
          description: Отображаемое имя пользователя в интерфейсе.
        bio:
          type: string
        specialization_id:
